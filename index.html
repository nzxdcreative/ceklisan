
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inspector Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <div>
      <h1>INSPECTOR WEB</h1>
      <p>Vehicle Inspection System</p>
    </div>
  </header>

  <main class="container">

    <section class="panel">
      <h2>IDENTITAS KENDARAAN</h2>

      <div class="form-grid">
        <label>
          Tanggal Masuk
          <input type="date" id="tanggalMasuk" required>
        </label>

        <label>
          Nama Vendor
          <input type="text" id="namaVendor" placeholder="Nama vendor" required>
        </label>

        <label>
          Nopol
          <input type="text" id="nopol" placeholder="Contoh: B 1234 XYZ" required>
        </label>

        <label>
          Merk / Jenis
          <input type="text" id="merkJenis" placeholder="Contoh: Toyota Avanza" required>
        </label>

        <label>
          Warna
          <input type="text" id="warna" placeholder="Warna kendaraan" required>
        </label>

        <label>
          Tahun
          <input type="number" id="tahun" placeholder="Tahun kendaraan" min="1900" required>
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="section-heading">
        <div>
          <h2>CHECKLIST INSPEKSI</h2>
          <p>Pilih kondisi kendaraan pada setiap item.</p>
        </div>
        <span id="progress">0 / 32</span>
      </div>

      <div id="checklistContainer"></div>
    </section>

    <section class="action-panel">
      <button type="button" class="btn btn-secondary" id="resetButton">
        Reset Form
      </button>

      <button type="button" class="btn btn-primary" id="downloadButton">
        Generate & Download JPG
      </button>
    </section>

    <p id="notification" class="notification" aria-live="polite"></p>

  </main>

  <!-- Area khusus laporan yang akan diubah menjadi JPG -->
  <div class="report-wrapper">
    <div id="report" class="report"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="script.js"></script>

</body>
</html>
